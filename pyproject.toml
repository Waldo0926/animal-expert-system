[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-expert-system"
version = "2.0.0"
description = "A bilingual rule-based animal identification expert system with forward chaining."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Shuoxun Wen"}
]
keywords = ["artificial-intelligence", "expert-system", "symbolic-ai", "forward-chaining", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
dev = ["pytest>=8.0"]

[project.scripts]
animal-expert-system = "animal_expert_system.cli:main"
animal-expert-gui = "animal_expert_system.gui:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
animal_expert_system = ["data/*.json"]
